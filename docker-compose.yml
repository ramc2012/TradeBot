# Port mapping (host:container)
#   db       → 5433:5432   (5432 already in use on host)
#   redis    → 6383:6379   (6379-6382 already in use on host)
#   backend     → 8000:8000
#   frontend-v2 → 3000:3001   (v2 is the primary workspace, served on :3000)
#   frontend    → 3001:3000   (legacy v1, retained on :3001 as fallback)

# ── json-file log rotation (added 2026-07-27) ─────────────────────────────
# WHY THIS IS NOT COSMETIC.  Every service ran with `json-file` and NO
# options, i.e. ONE unbounded log file per container, appended to forever
# across stop/start (the file is keyed to the container ID, not the boot).
# On 2026-07-24 two ungraceful host reboots left NUL runs inside those files
# where the VM's ext4 page cache never flushed (backend: 3887 zero bytes at
# offset 115,945,681 and 247 at 127,123,209; redis and research-sync got the
# same treatment within 53 s).  Docker's sequential log reader ABORTS at the
# first NUL, so `docker logs <c>` and `docker logs --since ...` returned
# nothing after 2026-07-24 04:36:45Z even though the app never stopped
# writing — 45 MB / ~243k lines were unreachable and every log-based
# conclusion drawn since Friday was unverifiable.  Nothing was wrong with the
# app's logging; the log FILE was permanently poisoned and only a container
# RECREATE (new ID ⇒ new file) could clear it.
#
# With rotation a corrupt segment AGES OUT instead of poisoning the stream
# forever, and each container is capped at 250 MB (5 × 50 MB) instead of
# growing without limit on a data volume that is already at 98%.
x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

services:
  db:
    image: timescale/timescaledb:latest-pg15
    container_name: nomadcurie_db
    environment:
      POSTGRES_USER: nomadcurie
      POSTGRES_PASSWORD: nomadcurie
      POSTGRES_DB: nomadcurie
    ports:
      - "5433:5432"
    volumes:
      - db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U nomadcurie"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging
    # OOM containment (2026-07): the Docker VM was 7.75GiB and shared with a
    # second TimescaleDB + ~24 containers. PG was auto-tuned as if it owned the
    # whole VM (shared_buffers 1.94GB) → 786 VM-wide OOM signal-9 kills in 7
    # days. The postgres memory caps live in ALTER SYSTEM (persisted in the data
    # volume); this cgroup limit bounds nomadcurie_db's fair share so a query
    # spike is contained here instead of the VM OOM-killer taking down a random
    # container.
    #
    # 2026-07-20: raised 3g → 6g. The containment premise no longer holds — the
    # VM is now 9.70GiB and only 5 of 28 containers run (the second TimescaleDB
    # is stopped), so ~6.8GiB sat idle while PG strangled. At 3g the cgroup read
    # 2.99/3.22GB (92.8%) while IDLE, with oom_kill=6 and 2,360,715 memory.max
    # events — i.e. continuous page-cache reclaim taxing every query on the hot
    # path, not merely a crash risk. 6g leaves ~3.7GiB for the rest of the VM.
    # If the second TimescaleDB is ever restarted, revisit this number first.
    # Paired with max_parallel_workers_per_gather 5 → 2 (ALTER SYSTEM) to bound
    # the worst-case parallel-scan spike that caused the kills.
    mem_limit: 6g
    shm_size: 512m

  redis:
    image: redis:7-alpine
    container_name: nomadcurie_redis
    ports:
      - "6383:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    logging: *default-logging

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nomadcurie_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      APP_ENV: production
      # Internal Docker network addresses (container-to-container, use original ports)
      DATABASE_URL: postgresql+asyncpg://nomadcurie:nomadcurie@db:5432/nomadcurie
      REDIS_URL: redis://redis:6379/0
      APP_TOKEN_AUTH_ENABLED: ${APP_TOKEN_AUTH_ENABLED:-false}
      APP_WRITE_TOKEN: ${APP_WRITE_TOKEN:-}
      RESEARCH_SYNC_AUTO_ENABLED: ${RESEARCH_SYNC_AUTO_ENABLED:-true}
      RESEARCH_SYNC_EMBEDDED_ENABLED: ${RESEARCH_SYNC_EMBEDDED_ENABLED:-false}
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      BACKEND_CORS_ORIGIN_REGEX: "${BACKEND_CORS_ORIGIN_REGEX:-^https?://[^/]+(:[0-9]+)?$}"
      # Phase-1 process split (opt-in). Default `docker compose up` keeps this
      # single all-in-one backend (LANESET=all → byte-identical boot). To split:
      #   LANESET=core BROKER_REST_BUDGET_FRACTION=0.7 \
      #     docker compose --profile split up -d backend backend-strategies
      # Rollback: `docker compose up -d backend` with LANESET unset.
      LANESET: ${LANESET:-all}
      BROKER_REST_BUDGET_FRACTION: ${BROKER_REST_BUDGET_FRACTION:-1.0}
    volumes:
      - ./backend:/app
      # MACD Refined research dataset and live catalog/lot-size lookup.
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      # Startup runway: the lifespan (agents, supervisor, broker restore, AI lane)
      # can take >1m. Without start_period the backend is marked unhealthy during
      # startup and compose aborts the `up`, orphaning the frontend (deploy casualty
      # seen 2026-06-04). During this window failing checks don't count as unhealthy.
      start_period: 150s
    command: >
      sh -c "python scripts/wait_for_db.py &&
             alembic upgrade head &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    logging: *default-logging

  # ── Phase-1 process split: strategy plane (opt-in via `--profile split`) ──
  # Same image + bind mounts as `backend`, but LANESET=strategies boots ONLY
  # the strategy runners + own-loop agents. It never opens a broker WS (the
  # core plane owns the ONE Fyers socket); ticks/marks come from the shared
  # Redis (tick:*/quotes:bus) and PG. No published port — its /health stays on
  # the internal Docker network, so the frontend keeps talking to the ONE core
  # backend. Its own healthcheck + restart policy give per-plane autoheal: a
  # strategy stall restarts THIS container only; quotes/marks/API unaffected.
  # Default `docker compose up` ignores this service entirely (profiles).
  backend-strategies:
    # Same IMAGE as the core backend (one image, two boot planes). Referencing
    # the built tag directly lets `up backend-strategies` reuse it without a
    # rebuild — the code arrives via the same ./backend bind mount anyway.
    image: tradebot-backend:latest
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nomadcurie_backend_strategies
    profiles: ["split"]
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://nomadcurie:nomadcurie@db:5432/nomadcurie
      REDIS_URL: redis://redis:6379/0
      APP_TOKEN_AUTH_ENABLED: ${APP_TOKEN_AUTH_ENABLED:-false}
      APP_WRITE_TOKEN: ${APP_WRITE_TOKEN:-}
      RESEARCH_SYNC_AUTO_ENABLED: ${RESEARCH_SYNC_AUTO_ENABLED:-true}
      RESEARCH_SYNC_EMBEDDED_ENABLED: "false"
      BACKEND_CORS_ORIGINS: '${BACKEND_CORS_ORIGINS:-["http://localhost:3000","http://127.0.0.1:3000"]}'
      BACKEND_CORS_ORIGIN_REGEX: "${BACKEND_CORS_ORIGIN_REGEX:-^https?://[^/]+(:[0-9]+)?$}"
      # Hard-set (not env-substituted): this service IS the strategy plane.
      LANESET: strategies
      # Phase-1 REST budget share (core=0.7 / strategies=0.3); Phase 2 replaces
      # the static fractions with a shared Redis token bucket.
      #
      # Rebalanced 2026-08-28 from 0.6/0.4. The fractions must still sum to 1.0
      # — that invariant is what keeps the two planes jointly under the per-token
      # cap, and it is the only reason this is safe to change.
      # Measured over a 2-minute sweep during the 10:15 bar: this plane sat flat
      # at 176-193 of its 720 (27%), while core sawtoothed 669 -> 902 of its
      # 1080 and peaked within 178 of the ceiling. The core-only
      # upstox_chain_builder needs ~213 calls per 30m bar, so it did not fit
      # (902 + 213 = 1115 > 1080) while 527 sat idle over here.
      # After: core 1260 (worst case 1115, ~12% headroom), this plane 540
      # against an observed peak of 193 — still ~2.8x its own demand.
      BROKER_REST_BUDGET_FRACTION: "0.3"
    volumes:
      - ./backend:/app
      - ./data:/data:ro
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 150s
    # No alembic here — the CORE backend owns migrations (avoids a two-process
    # migration race on `--profile split up`).
    command: >
      sh -c "python scripts/wait_for_db.py &&
             uvicorn main:app --host 0.0.0.0 --port 8000"
    restart: unless-stopped
    logging: *default-logging

  research-sync:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: nomadcurie_research_sync
    env_file:
      - .env
    environment:
      APP_ENV: production
      DATABASE_URL: postgresql+asyncpg://nomadcurie:nomadcurie@db:5432/nomadcurie
      REDIS_URL: redis://redis:6379/0
      RESEARCH_SYNC_AUTO_ENABLED: ${RESEARCH_SYNC_AUTO_ENABLED:-true}
      RESEARCH_FROM_DATE: ${RESEARCH_FROM_DATE:-2025-03-28}
      RESEARCH_TO_DATE: ${RESEARCH_TO_DATE:-2026-03-28}
      RESEARCH_POLL_MINUTES: ${RESEARCH_POLL_MINUTES:-30}
      RESEARCH_BACKLOG_POLL_SECONDS: ${RESEARCH_BACKLOG_POLL_SECONDS:-60}
      RESEARCH_UNDERLYING_LIMIT: ${RESEARCH_UNDERLYING_LIMIT:-10}
      RESEARCH_EXPIRY_LIMIT: ${RESEARCH_EXPIRY_LIMIT:-20}
      RESEARCH_SPOT_LIMIT: ${RESEARCH_SPOT_LIMIT:-5}
      RESEARCH_CONTRACT_LIMIT: ${RESEARCH_CONTRACT_LIMIT:-120}
      RESEARCH_UPSTOX_GAP_SECONDS: ${RESEARCH_UPSTOX_GAP_SECONDS:-1.0}
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command:
      - sh
      - -lc
      - >
          python scripts/wait_for_db.py &&
          alembic upgrade head &&
          python -m data.run_upstox_research_sync
          --from-date $$RESEARCH_FROM_DATE
          --to-date $$RESEARCH_TO_DATE
          --poll-minutes $$RESEARCH_POLL_MINUTES
          --backlog-poll-seconds $$RESEARCH_BACKLOG_POLL_SECONDS
          --underlying-limit $$RESEARCH_UNDERLYING_LIMIT
          --expiry-limit $$RESEARCH_EXPIRY_LIMIT
          --spot-limit $$RESEARCH_SPOT_LIMIT
          --contract-limit $$RESEARCH_CONTRACT_LIMIT
          --upstox-gap-seconds $$RESEARCH_UPSTOX_GAP_SECONDS
          --daemon
    restart: unless-stopped
    logging: *default-logging

  # ──────────────────────────────────────────────────────────────────
  # v1 frontend (nomadcurie_frontend, :3001) — RETIRED 2026-06-07.
  # v2 reached parity and is the sole UI on :3000. The legacy service was
  # removed to reclaim ~150-200 MB RSS on the t3.medium. The /frontend build
  # context is kept in-repo for one cycle; delete it once v2 is confirmed stable.
  # frontend-v2: the PRIMARY (and only) trader workspace, served on :3000.
  # ──────────────────────────────────────────────────────────────────
  frontend-v2:
    build:
      context: ./frontend-v2
      dockerfile: Dockerfile
    container_name: nomadcurie_frontend_v2
    ports:
      - "3000:3001"
    env_file:
      - .env
    environment:
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-}
      NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
      NEXT_PUBLIC_BACKEND_PORT: ${NEXT_PUBLIC_BACKEND_PORT:-8000}
      API_URL: ${API_URL:-http://backend:8000}
      APP_TOKEN_AUTH_ENABLED: ${APP_TOKEN_AUTH_ENABLED:-false}
      NEXT_PUBLIC_APP_TOKEN_AUTH_ENABLED: ${NEXT_PUBLIC_APP_TOKEN_AUTH_ENABLED:-false}
      APP_WRITE_TOKEN: ${APP_WRITE_TOKEN:-}
    depends_on:
      backend:
        # service_started (not _healthy): the UI must never be orphaned by a slow
        # backend healthcheck. It tolerates a not-yet-ready backend (WS reconnect /
        # loading states) until the API comes up.
        condition: service_started
    restart: unless-stopped
    logging: *default-logging

volumes:
  db_data:
  redis_data:
