[pytest]
# Backend unit/contract test suite. Run from backend/ with `pytest` (or the repo
# `make test` target). The suite is designed to be self-contained: it mocks or
# gracefully degrades every external dependency (Postgres, Redis, brokers), so it
# passes with no database or network — see tests/conftest.py.
testpaths = tests
# Tests opt into async via @pytest.mark.asyncio; the rest drive coroutines through
# asyncio.run() / a dedicated loop. Strict mode keeps that contract explicit.
asyncio_mode = strict
addopts = -ra
