<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>Sniper Paper · Signal</title>
  <link rel="stylesheet" href="/static/styles.css" />
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.0/dist/chart.umd.min.js"></script>
</head>
<body>
  <nav class="topnav">
    <a href="/">Overview</a>
    <a href="/model.html">Model</a>
    <a href="/features.html">Features</a>
    <a href="/signals.html">Signals</a>
  </nav>
  <main>
    <section class="card">
      <h2 id="title">Signal</h2>
      <div id="meta" class="kv">loading…</div>
    </section>
    <section class="card">
      <h2 id="shap-title">Per-feature contribution</h2>
      <p class="muted" id="shap-help"></p>
      <div class="chartbox" id="shap-box" style="height:480px"><canvas id="shap"></canvas></div>
    </section>
    <section class="card">
      <h2>Feature snapshot</h2>
      <table id="feats">
        <thead><tr><th>Feature</th><th>Value</th><th>Contribution</th></tr></thead>
        <tbody></tbody>
      </table>
    </section>
  </main>
  <script src="/static/app.js"></script>
  <script>
    (async () => {
      const id = new URLSearchParams(location.search).get("id");
      if (!id) { document.getElementById("meta").textContent = "Missing ?id="; return; }

      const data = await fetchJSON(`/api/signals/${id}/explain`);
      const s = data.signal;
      document.getElementById("title").textContent = `Signal #${id} · ${s.instrument} · ${s.setup_name}`;

      const ex = data.explanation;
      // Normalise across backends: LightGBM uses contribution_to_logit, NN uses attribution.
      const isNN = (ex.method || "").includes("NN");
      const valKey = isNN ? "attribution" : "contribution_to_logit";
      const heads = ex.heads_output;

      document.getElementById("meta").innerHTML = `
        <div><span>decision_ts</span><span class="mono">${fmtTS(s.decision_ts)}</span></div>
        <div><span>side / entry / stop / target</span>
          <span class="mono">${s.side} · ${(+s.entry_price).toFixed(2)} · ${(+s.stop_price).toFixed(2)} · ${(+s.target_price).toFixed(2)}</span>
        </div>
        <div><span>p_win / E[R]</span>${(+s.p_win).toFixed(3)} / ${(+s.expected_net_R).toFixed(3)}</div>
        ${heads ? `<div><span>NN heads</span><span class="mono">p_win ${(+heads.p_win).toFixed(3)} · E[R] ${(+heads.expected_R).toFixed(3)} · MFE ${(+heads.mfe).toFixed(2)} · MAE ${(+heads.mae).toFixed(2)}</span></div>` : ''}
        <div><span>gate</span>${s.gate_decision} <span class="muted small">${s.gate_reason ?? ''}</span></div>
        <div><span>in_distribution</span>${s.in_distribution ? "yes" : "no — OOD instrument"}</div>
        <div><span>model</span><span class="mono small">${s.model_artifact}</span></div>
        <div><span>method</span><span class="muted small">${escapeHTML(ex.method)}</span></div>
      `;

      document.getElementById("shap-title").textContent = isNN
        ? "Per-feature attribution (gradient × input)"
        : "Per-feature contribution to logit(p_win)";
      document.getElementById("shap-help").innerHTML = isNN
        ? `NN saliency: the gradient of <code>p_win</code> w.r.t. each standardised input,
           multiplied by the input value. Positive bars pushed this decision toward "win".`
        : `LightGBM <code>pred_contrib=True</code> output — exact tree SHAP. Each bar shows how much
           that feature pushed the classifier's log-odds up or down for THIS signal vs average.`;

      const top = ex.feature_contributions;
      const val = r => r[valKey];
      const colors = top.map(r => val(r) >= 0 ? "rgba(82, 196, 156, 0.7)" : "rgba(200, 90, 90, 0.7)");
      // Scale the (bounded) box height to the number of horizontal bars so they stay readable.
      document.getElementById("shap-box").style.height =
        Math.min(900, Math.max(240, top.length * 26)) + "px";
      new Chart(document.getElementById("shap").getContext("2d"), {
        type: "bar",
        data: {
          labels: top.map(r => r.feature),
          datasets: [{ label: isNN ? "attribution" : "Δ logit", data: top.map(val), backgroundColor: colors }],
        },
        options: { indexAxis: "y", ...chartOpts() },
      });

      document.querySelector("#feats tbody").innerHTML = top.map(r => `
        <tr>
          <td class="mono">${escapeHTML(r.feature)}</td>
          <td class="mono">${r.value === null ? '—' : Number(r.value).toFixed(4)}</td>
          <td class="mono ${val(r) >= 0 ? 'pos' : 'neg'}">${val(r).toFixed(4)}</td>
        </tr>`).join("");
    })().catch(alertErr);
  </script>
</body>
</html>
