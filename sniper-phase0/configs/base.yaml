# Phase 0 base configuration.
# Keep parameters here; do not hardcode in source.

paths:
  data_root: "./data"
  trade_log: "./data/raw/zerodha_tradebook_fy25_fy26.csv"  # user provides later
  underlying_ticks: "./data/raw/underlying_ticks"           # parquet partitioned by date
  book_snapshots: "./data/raw/book_snapshots"               # parquet partitioned by date
  features_out: "./data/processed/features.parquet"
  labels_out: "./data/processed/labels.parquet"
  model_out: "./data/processed/lgbm_baseline.txt"
  reports_out: "./data/processed/reports"

instruments:
  - NIFTY
  - BANKNIFTY

# Walk-forward CV. All dates inclusive.
walk_forward:
  train_months: 6
  validate_months: 1
  test_months: 1
  step_months: 1
  start: "2024-04-01"   # FY25 start
  end: "2026-03-31"     # FY26 end
  # Drop training rows whose label exit_ts + margin falls inside validation window.
  # Default matches labeling.max_hold_minutes; raise to add safety margin.
  purge_minutes: 90

# Cost model parameters. Tuned to Zerodha F&O for FY25-FY26.
# Recalibrate slippage_bps from realised fills vs midprice once trade log is loaded.
costs:
  brokerage_per_order_inr: 20.0          # flat Zerodha F&O charge
  exchange_txn_charge_bps: 0.345         # NSE F&O transaction charges (bps of turnover)
  sebi_charge_bps: 0.001
  stt_bps_sell_side: 1.25                # STT on sell side, F&O
  stamp_duty_bps_buy_side: 0.2           # buy side only
  gst_on_brokerage_pct: 18.0
  gst_on_exchange_pct: 18.0
  slippage_bps_default: 1.5              # placeholder; recalibrate from fills
  slippage_bps_event_day: 3.0

# Triple-barrier labeler defaults. Stops/targets are normally MP-derived per-trade;
# these are fallbacks when MP context is missing.
labeling:
  default_stop_pct: 0.4
  default_target_pct: 0.8
  max_hold_minutes: 90

# Decision gate — DO NOT change mid-experiment.
decision_gate:
  skip_accuracy_bottom_decile_min: 0.65
  net_profit_factor_min_at_2x_slippage: 1.5
  max_drawdown_pct_max: 15.0
