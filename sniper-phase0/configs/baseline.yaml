# LightGBM directional multi-head config.

model: directional_lightgbm

params:
  learning_rate: 0.03
  num_leaves: 31
  min_data_in_leaf: 10
  feature_fraction: 0.9
  bagging_fraction: 0.9
  bagging_freq: 3
  seed: 42

training:
  num_boost_round: 300
  early_stopping_rounds: 50

walk_forward:
  train_months: 6
  test_months: 1
  purge_days: 0
  embargo_minutes: 60
  min_train_size: 50

categorical_features:
  - u_location_vs_prev_value
  - u_open_location
  - u_open_type
  - u_day_type
  - c_time_of_day_bucket
  - c_day_of_week

decision_threshold:
  p_move: 0.5
